<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>問題アプリ</title>
<style>
:root{
  --bg:#1e1e1e; --card:#2d2d2d; --border:#404040; --text:#e0e0e0; --muted:#a0a0a0;
  --accent:#4ec9b0; --success:#b5cea8; --warning:#f14c4c; --normal:#569cd6; --input:#3c3c3c;
}
body.rpg{--bg:#0f0f1a;--card:#1a1a2e;--border:#3b3b6d;--text:#f0f0f5;--muted:#9494b8;--accent:#ffd700;--success:#00ffcc;--warning:#ff4757;--normal:#3498db;--input:#242438}
body.souls{--bg:#12100e;--card:#1c1917;--border:#4a413b;--text:#e6dbc9;--muted:#8c8275;--accent:#e65100;--success:#48c9b0;--warning:#a93226;--normal:#d35400;--input:#282420}
body.persona{--bg:#0c0c0c;--card:#191919;--border:#3d3d3d;--text:#f5f5f5;--muted:#9c9c9c;--accent:#e60012;--success:#2fd673;--warning:#ff7a1a;--normal:#57a7ff;--input:#242424}
body.zelda{--bg:#0d1b1e;--card:#173034;--border:#2f4f52;--text:#e9f2e7;--muted:#96ada0;--accent:#5ec8e5;--success:#8bc34a;--warning:#ef5350;--normal:#d9b45b;--input:#1f3d40}
body.genshin{--bg:#f2ecdc;--card:#fbf8ef;--border:#d9cfb4;--text:#3c4048;--muted:#8d8672;--accent:#a87f2d;--success:#4e9a68;--warning:#cf5246;--normal:#5b7fa6;--input:#fffdf4}
body.nier{--bg:#d3cfba;--card:#e2ddc9;--border:#a8a38d;--text:#454138;--muted:#7c7767;--accent:#8c4a32;--success:#5f7052;--warning:#b03a2e;--normal:#5d6d7e;--input:#eae6d2}
body.doubutsu{--bg:#f6f1de;--card:#fffdf0;--border:#cfdfb4;--text:#59523d;--muted:#9c9377;--accent:#4f9e5f;--success:#35a06b;--warning:#e0684b;--normal:#4a90c2;--input:#fdfaf0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;min-height:100vh;display:flex;flex-direction:column}
body,.card,.item,.modebtn,.add,.pill{transition:background-color .35s ease,border-color .35s ease,color .35s ease}
header{padding:10px 14px 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header h1{font-size:17px;margin:0}
header .sp{flex:1}
header h1{cursor:pointer}
.backbar{margin-bottom:2px}
.backbtn{background:none;border:none;color:var(--muted);font-size:14px;font-weight:700;cursor:pointer;padding:4px 6px 4px 0;display:inline-flex;align-items:center;gap:1px}
.backbtn svg{width:18px;height:18px;display:block}
.bar.qbar{margin:0 0 14px}
button{font-family:inherit;transition:transform .08s ease,background-color .2s ease,border-color .2s ease,color .2s ease;touch-action:manipulation}
button:active{transform:scale(.965)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
select,input,textarea{background:var(--input);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px;font-size:15px}
#themeSel{width:88px;font-size:13px;padding:2px}
.iconbtn{background:none;border:1px solid var(--border);border-radius:10px;color:var(--muted);padding:7px 9px;cursor:pointer;line-height:0}
.iconbtn svg{width:20px;height:20px;display:block}
main{flex:1;display:flex;flex-direction:column;padding:12px 14px 28px;gap:10px;max-width:720px;width:100%;margin:0 auto}
.view{display:none}
.view.on{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.view.on{animation:fadeUp .25s ease-out}
.stats{font-size:13px;color:var(--accent);font-weight:700;padding:0 2px;text-align:center}
.item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;animation:fadeUp .3s ease-out backwards}
.item .ttl{font-size:16px;font-weight:700}
.item .meta{color:var(--accent);font-size:12px;margin-top:2px}
.item.deckcard{padding:14px}
.item.deckcard .ttl{font-size:21px;line-height:1.35}
.statchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.statchip{background:var(--input);border:1px solid var(--border);border-radius:10px;padding:6px 12px 7px;min-width:66px}
.statchip .sl{display:block;font-size:10px;color:var(--muted)}
.statchip .sv{display:block;font-size:18px;font-weight:800;color:var(--accent);line-height:1.3}
#deckMenuStats .statchips{margin-top:0}
#deckMenuStats{margin-bottom:14px}
.item.allchap{border:1.5px solid var(--accent);background:var(--input)}
.item.allchap .ttl{color:var(--accent)}
.modebtn{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;color:var(--text);cursor:pointer}
.modebtn .t{font-size:15px;font-weight:700}
.modebtn .d{color:var(--muted);font-size:13px;margin-top:3px;line-height:1.5}
.modebtn:disabled{opacity:.45;cursor:default}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px 18px;position:relative}
.qmeta{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.qunit{font-size:12px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:2px 9px}
.qprog{font-size:12px;color:var(--muted);font-weight:700}
.starbtn{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;line-height:0;padding:4px}
.starbtn svg{width:24px;height:24px;display:block}
.starbtn.on{color:var(--accent)}
.qtext{font-size:19px;line-height:1.6;font-weight:700;white-space:pre-line}
.choices{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.choice{text-align:left;background:var(--input);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:16px;cursor:pointer;line-height:1.5}
.choice:disabled{cursor:default}
.choice.correct{border-color:var(--success);color:var(--success);font-weight:800}
.choice.wrong{border-color:var(--warning);color:var(--warning);font-weight:800}
.choice.dim{opacity:.55}
.panel{margin-top:16px;border:1px solid var(--border);border-radius:12px;padding:14px;display:none;line-height:1.7;font-size:15px}
.panel.on{display:block}
.panel .verdict{font-size:16px;font-weight:800;margin-bottom:6px}
.panel .verdict.ok{color:var(--success)}
.panel .verdict.ng{color:var(--warning)}
.panel .trap{margin-top:10px;border-top:1px dashed var(--border);padding-top:10px;color:var(--muted)}
.panel .trap b{color:var(--text)}
.favprompt{margin-top:12px;border:1px solid var(--accent);border-radius:12px;padding:12px 14px;display:none;font-size:14px;line-height:1.6}
.favprompt.on{display:block}
.favprompt button{margin-top:8px;background:none;border:1px solid var(--accent);color:var(--accent);border-radius:10px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer}
.qnav{display:flex;gap:10px;margin-top:16px}
.navbtn{flex:1;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px;font-weight:700;cursor:pointer}
.navbtn:disabled{opacity:.4;cursor:default}
.bar{height:10px;background:var(--input);border-radius:6px;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.plainbtn{display:block;width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:15px;font-weight:700;cursor:pointer;margin-top:10px}
.result-score{font-size:22px;font-weight:800;text-align:center;padding:16px 0 6px}
.missitem{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px;line-height:1.6}
.missitem .a{color:var(--success);font-weight:700}
.missitem button{margin-top:6px;background:none;border:1px solid var(--accent);color:var(--accent);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:700;cursor:pointer}
.note{font-size:12px;color:var(--muted);line-height:1.6}
.note b{color:var(--text)}
.err{color:var(--warning);font-size:14px;line-height:1.7;padding:12px 0}
h2.sec{font-size:15px;margin:20px 0 8px;color:var(--muted)}
.sumrow{margin-top:10px}
.sumbtn{background:var(--input);border:1px solid var(--accent);color:var(--accent);border-radius:10px;padding:9px 16px;font-size:14px;font-weight:700;cursor:pointer}
.sum-unit{font-size:16px;font-weight:800;line-height:1.5}
.sum-intro{line-height:1.85;font-size:15px;margin:12px 0 4px}
h3.sum-sec{font-size:14px;margin:18px 0 6px;color:var(--accent)}
.sum-list{margin:0;padding-left:20px;line-height:1.75;font-size:14px}
.sum-list li{margin-bottom:5px}
.sum-start{border-color:var(--accent);color:var(--accent)}
.pill{border:1px solid var(--border);background:var(--card);color:var(--accent);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.pill.err{color:var(--warning);border-color:var(--warning)}
.add{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.add .rowbtns{display:flex;gap:8px;flex-wrap:wrap}
.add button{background:var(--input);color:var(--accent);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:15px;font-weight:800;cursor:pointer}
#ghStatus{font-size:12px;color:var(--muted);line-height:1.6}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <h1 id="hdrHome" title="タイトルへ戻る"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg> <span id="hdrTitle">問題アプリ</span></h1>
  <div class="sp"></div>
  <button class="pill" id="syncPill"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px" aria-hidden="true"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg> 未設定</button>
  <select id="themeSel" aria-label="テーマ">
    <option value="">ダーク</option>
    <option value="rpg">レトロ</option>
    <option value="souls">ソウル</option>
    <option value="persona">レッド</option>
    <option value="zelda">ティール</option>
    <option value="genshin">アイボリー</option>
    <option value="nier">セピア</option>
    <option value="doubutsu">パステル</option>
  </select>
  <button class="iconbtn" id="btnAbout" title="設定・このアプリについて" aria-label="設定・このアプリについて">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1"/></svg>
  </button>
</header>
<main>
  <!-- デッキ選択 -->
  <section class="view" id="view-decks">
    <div class="stats" id="deckStats"></div>
    <div id="deckList"></div>
    <div class="card" id="deckGuide" style="display:none;cursor:default">
      <div class="note" id="deckGuideText"></div>
      <button class="plainbtn" id="btnGuideSettings">設定を開く</button>
      <button class="plainbtn" id="btnGuideRetry" style="display:none">再読み込み</button>
    </div>
    <div class="err" id="deckErr"></div>
  </section>

  <!-- デッキ内メニュー -->
  <section class="view" id="view-deck">
    <div class="backbar"><button class="backbtn" id="btnDeckHome"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>デッキ選択</button></div>
    <div id="deckMenuStats"></div>
    <button class="modebtn" id="btnResume" style="display:none"><span class="t">続きから解く</span><div class="d" id="resumeDesc"></div></button>
    <button class="modebtn" id="btnReview"><span class="t">復習</span><div class="d" id="reviewDesc">お気に入りに登録した問題が、間隔を空けて出題されます。</div></button>
    <button class="modebtn" id="btnRandom"><span class="t">ランダム</span><div class="d">全問題からランダムに出題します。</div></button>
    <h2 class="sec">章</h2>
    <div id="chapterList"></div>
  </section>

  <!-- 章のまとめ -->
  <section class="view" id="view-summary">
    <div class="backbar"><button class="backbtn" id="btnSumTopBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg><span id="sumBackLabel">章一覧</span></button></div>
    <div class="card">
      <div class="sum-unit" id="sumUnit"></div>
      <p class="sum-intro" id="sumIntro"></p>
      <h3 class="sum-sec">種類と全体像</h3>
      <ul class="sum-list" id="sumMap"></ul>
      <h3 class="sum-sec">押さえるポイント</h3>
      <ul class="sum-list" id="sumPoints"></ul>
      <h3 class="sum-sec">問題を解くときの見方</h3>
      <ul class="sum-list" id="sumTips"></ul>
    </div>
    <button class="plainbtn sum-start" id="btnSumStart">この章の問題を解く</button>
  </section>

  <!-- 出題 -->
  <section class="view" id="view-quiz">
    <div class="backbar"><button class="backbtn" id="btnQuizBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>章一覧</button></div>
    <div class="card">
      <div class="qmeta">
        <span class="qunit" id="qUnit"></span>
        <span class="qprog" id="qProg"></span>
        <button class="starbtn" id="btnStar" aria-label="お気に入り">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3.6l2.5 5.2 5.7.8-4.1 4 1 5.7-5.1-2.7-5.1 2.7 1-5.7-4.1-4 5.7-.8z"/></svg>
        </button>
      </div>
      <div class="bar qbar"><i id="qBarFill"></i></div>
      <div class="qtext" id="qText"></div>
      <div class="choices" id="qChoices"></div>
      <div class="panel" id="qPanel">
        <div class="verdict" id="qVerdict"></div>
        <div id="qExplain"></div>
        <div class="trap" id="qTrap" style="display:none"></div>
      </div>
      <div class="favprompt" id="favPrompt">
        この問題をお気に入りに登録すると、毎日の復習に出るようになります。
        <br><button id="btnFavPrompt">お気に入りに登録する</button>
      </div>
      <div class="qnav">
        <button class="navbtn" id="btnPrev">← 前の問題</button>
        <button class="navbtn" id="btnNextQ">次の問題 →</button>
      </div>
    </div>
  </section>

  <!-- 結果 -->
  <section class="view" id="view-result">
    <div class="backbar"><button class="backbtn" id="btnResTopBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>章一覧</button></div>
    <div class="result-score" id="resScore"></div>
    <div class="stats" id="resSub"></div>
    <h2 class="sec" id="resMissTitle">間違えた問題</h2>
    <div id="resMiss"></div>
    <button class="plainbtn" id="btnResRetry" style="display:none"></button>
  </section>

  <!-- 設定・このアプリについて -->
  <section class="view" id="view-about">
    <div class="backbar"><button class="backbtn" id="btnAboutTopBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg>戻る</button></div>
    <form class="add" id="ghForm">
      <div><b><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px" aria-hidden="true"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg> GitHub同期</b></div>
      <input id="ghOwner" type="text" autocomplete="off" placeholder="GitHubユーザー名（owner）">
      <input id="ghRepo" type="text" autocomplete="off" placeholder="リポジトリ名（Private）">
      <input id="ghToken" type="password" autocomplete="off" placeholder="トークン（Contents: Read and write）">
      <input id="ghBranch" type="text" autocomplete="off" placeholder="ブランチ（空欄なら main）">
      <div class="rowbtns">
        <button type="button" id="ghSave">設定を保存</button>
        <button type="button" id="ghSyncNow">今すぐ同期</button>
      </div>
      <div class="note" id="ghStatus">未設定：ローカル保存のみで動作中</div>
    </form>
  </section>
</main>
<script>
'use strict';
const LS_KEY = 'quizapp_v1_state';
const $ = id => document.getElementById(id);

function todayStr(d){
  const t = d ? new Date(d) : new Date();
  return t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0');
}
function addDays(n){
  const t = new Date(); t.setDate(t.getDate() + n);
  return todayStr(t);
}
function loadState(){
  try{ return JSON.parse(localStorage.getItem(LS_KEY)) || {}; }catch(e){ return {}; }
}
function persist(){ try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){} }
function saveState(){ persist(); schedulePush(); }
let state = loadState();
state.favs = state.favs || {};   // {deckId: {qid: true}}
state.srs  = state.srs  || {};   // {deckId: {qid: {interval, next_review, lapses}}}
state.hist = state.hist || {};   // {deckId: {qid: {seen, correct}}}

function isFav(deckId, qid){ return !!(state.favs[deckId] && state.favs[deckId][qid]); }
function setFav(deckId, qid, on){
  state.favs[deckId] = state.favs[deckId] || {};
  if (on){ state.favs[deckId][qid] = true; }
  else { delete state.favs[deckId][qid]; if (state.srs[deckId]) delete state.srs[deckId][qid]; }
  saveState();
}
function isDue(deckId, qid){
  if (!isFav(deckId, qid)) return false;
  const s = state.srs[deckId] && state.srs[deckId][qid];
  if (!s) return true; // 登録したてはすぐ出題
  return (s.next_review || todayStr()) <= todayStr();
}
function dueList(deck){
  return deck.questions.filter(q => isDue(deck.id, q.id));
}
// 単語アプリの梯子：正解=normal（0→1日、以降×2）／不正解=hard（間隔を半分、lapses+1）
function applySRS(deckId, qid, correct){
  if (!isFav(deckId, qid)) return;
  state.srs[deckId] = state.srs[deckId] || {};
  const s = state.srs[deckId][qid] || { interval: 0, next_review: todayStr(), lapses: 0 };
  const cur = s.interval || 0;
  if (correct){ s.interval = cur === 0 ? 1 : Math.min(cur * 2, 365); }
  else { s.lapses = (s.lapses || 0) + 1; s.interval = cur <= 1 ? 0 : Math.floor(cur / 2); }
  s.next_review = addDays(s.interval);
  state.srs[deckId][qid] = s;
}
function recordHist(deckId, qid, correct){
  state.hist[deckId] = state.hist[deckId] || {};
  const h = state.hist[deckId][qid] || { seen: 0, correct: 0 };
  h.seen += 1; if (correct) h.correct += 1;
  state.hist[deckId][qid] = h;
}

// ---------- デッキ読み込み（GitHub Contents API・プライベート保存） ----------
// デッキは公開リポジトリには置かず、進捗と同じ Shuka314/app-data の
// quiz_decks/ フォルダに置く。読み込みには進捗同期と同じトークンを使う。
// 一度読み込んだデッキは端末にキャッシュし、次回はキャッシュを先に表示して
// 裏で更新を確認する（単語アプリの作法）。
const DECK_DIR = 'quiz_decks';
const DECK_INDEX_PATH = DECK_DIR + '/index.json';
const DECK_CACHE_KEY = 'quizDeckCacheV1';
let decks = [];       // 読み込み済みデッキオブジェクト
let curDeck = null;   // 現在のデッキ
let session = null;   // 現在のセッション {list, idx, modeLabel, answers:{idx: pickedIndex}, key, deckId, restart, done}
let sessions = {};    // deckId|key -> 未完了セッション（途中で離れても同じ章から再開できるよう保持）
let resumeTarget = null;
let resultRestart = null;

function deckPathOf(ent){
  const f = ent.file || (ent.id + '.json');
  return f.indexOf('/') >= 0 ? f : DECK_DIR + '/' + f;
}
// Contents API でファイルを1つ読む。404 は null、その他の失敗は throw。
// ghCfg / b64dec は下の GitHub 同期セクションで定義される（起動時に呼ばれるので問題ない）。
async function ghGetFile(path){
  const url = 'https://api.github.com/repos/' + ghCfg.owner + '/' + ghCfg.repo + '/contents/' + path + '?ref=' + (ghCfg.branch || 'main') + '&_=' + Date.now();
  const res = await fetch(url, { method: 'GET', cache: 'no-store', headers: { 'Authorization': 'Bearer ' + ghCfg.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' } });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error('GitHub API ' + res.status);
  const j = await res.json();
  return { json: JSON.parse(b64dec(j.content)), sha: j.sha };
}
function loadDeckCache(){
  try {
    const c = JSON.parse(localStorage.getItem(DECK_CACHE_KEY) || 'null');
    if (c && Array.isArray(c.decks) && c.decks.length) return c;
  } catch(e){}
  return null;
}
function saveDeckCache(indexSha, fileShas){
  try { localStorage.setItem(DECK_CACHE_KEY, JSON.stringify({ indexSha: indexSha || null, fileShas: fileShas || null, decks: decks, savedAt: Date.now() })); } catch(e){}
}
function showDeckGuide(kind, msg){
  const g = $('deckGuide'); if (!g) return;
  $('deckList').innerHTML = '';
  $('deckStats').textContent = '';
  let t = '';
  if (kind === 'token'){
    t = '<b>デッキは非公開で保存されています</b><br>問題デッキは、他人に見られないよう公開リポジトリではなく、プライベートリポジトリ（Shuka314 / app-data）の中に置いてあります。そのため、デッキを読み込むには GitHub トークンの設定が必要です。下のボタンから設定を開いてトークンを貼ってください（単語アプリで使っている、app-data にアクセスできるトークンがそのまま使えます）。';
  } else if (kind === 'notfound'){
    t = '<b>GitHub にデッキが見つかりませんでした</b><br>トークンは設定されていますが、保存先（Shuka314 / app-data の quiz_decks フォルダ）にデッキがまだ置かれていません。';
  } else {
    t = '<b>デッキの読み込みに失敗しました</b><br>' + (msg || '') + '<br>通信状態とトークンの権限を確認してください。';
  }
  $('deckGuideText').innerHTML = t;
  $('btnGuideRetry').style.display = kind === 'token' ? 'none' : 'block';
  g.style.display = 'block';
}
function hideDeckGuide(){ const g = $('deckGuide'); if (g) g.style.display = 'none'; }
// index と各デッキファイルを取得し、ファイルごとの sha も集める。失敗・欠落は null。
async function loadDecksFromGitHub(){
  const idx = await ghGetFile(DECK_INDEX_PATH);
  if (!idx) return null;
  const out = [];
  const fileShas = {};
  fileShas[DECK_INDEX_PATH] = idx.sha;
  for (const ent of idx.json.decks){
    const p = deckPathOf(ent);
    const f = await ghGetFile(p);
    if (!f) return null;
    f.json._file = p;
    fileShas[p] = f.sha;
    out.push(f.json);
  }
  return { decks: out, indexSha: idx.sha, fileShas: fileShas };
}
async function fetchDecksFromGitHub(){
  const r = await loadDecksFromGitHub();
  if (!r){ showDeckGuide('notfound'); return false; }
  decks = r.decks;
  saveDeckCache(r.indexSha, r.fileShas);
  hideDeckGuide();
  renderDeckList();
  return true;
}
// quiz_decks フォルダの一覧（ファイルごとの sha）を取得する。中身はダウンロードしない。
async function ghDirShaMap(){
  const url = 'https://api.github.com/repos/' + ghCfg.owner + '/' + ghCfg.repo + '/contents/' + DECK_DIR + '?ref=' + (ghCfg.branch || 'main') + '&_=' + Date.now();
  const res = await fetch(url, { method: 'GET', cache: 'no-store', headers: { 'Authorization': 'Bearer ' + ghCfg.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' } });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error('GitHub API ' + res.status);
  const arr = await res.json();
  if (!Array.isArray(arr)) return null;
  const map = {};
  arr.forEach(e => { if (e.type === 'file' && /\.json$/.test(e.name)) map[DECK_DIR + '/' + e.name] = e.sha; });
  return map;
}
function shaMapsEqual(a, b){
  const ka = Object.keys(a), kb = Object.keys(b);
  if (ka.length !== kb.length) return false;
  return ka.every(k => a[k] === b[k]);
}
// キャッシュ表示後に裏で更新を確認する。新しさの判定は index だけでなく
// デッキファイル自体の sha で行う（デッキだけ差し替わった更新も拾うため）。
// 旧形式キャッシュ（fileShas 無し）は常に古い扱いで、一度だけ取り直す。
async function revalidateDecks(){
  if (!ghReady()) return;
  try {
    const remote = await ghDirShaMap();
    if (!remote) return;
    const cache = loadDeckCache();
    if (cache && cache.fileShas && shaMapsEqual(cache.fileShas, remote)) return;
    const r = await loadDecksFromGitHub();
    if (!r) return;
    decks = r.decks;
    saveDeckCache(r.indexSha, r.fileShas);
    hideDeckGuide();
    const cur = document.querySelector('.view.on');
    if (cur && cur.id === 'view-decks') renderDeckList();
    if (curDeck){
      const fresh = decks.find(d => d.id === curDeck.id);
      if (fresh && fresh !== curDeck){
        curDeck = fresh;
        if (cur && cur.id === 'view-deck') openDeck(curDeck);
      }
    }
  } catch(e){ /* 裏での確認なので、失敗してもキャッシュ表示を続ける */ }
}
function show(view){
  document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
  $(view).classList.add('on');
  window.scrollTo(0,0);
}
function deckDisplayName(d){
  return (d.subject && d.subject !== d.title) ? d.subject + '｜' + d.title : d.title;
}
function deckUnits(deck){
  const seen = [], set = new Set();
  deck.questions.forEach(q => { if (!set.has(q.unit)){ set.add(q.unit); seen.push(q.unit); } });
  return seen;
}

function unitLabel(u){ return UNIT_LABELS[u] || u; }
// unit が null のときはデッキ全体の集計。正答率は回答履歴（hist）の累計ベース。
function unitStats(deck, unit){
  const qs = unit ? deck.questions.filter(q => q.unit === unit) : deck.questions;
  let favN = 0, answeredQ = 0, seen = 0, correct = 0;
  const hist = state.hist[deck.id] || {};
  qs.forEach(q => {
    if (isFav(deck.id, q.id)) favN += 1;
    const h = hist[q.id];
    if (h && h.seen > 0){ answeredQ += 1; seen += h.seen; correct += h.correct; }
  });
  return { total: qs.length, favN: favN, answeredQ: answeredQ, seen: seen, correct: correct, rate: seen > 0 ? Math.round(correct / seen * 100) : null };
}
function statsLine(st){
  let s = '全' + st.total + '問 ／ 回答済み ' + st.answeredQ + '問';
  if (st.rate !== null) s += ' ／ 正答率 ' + st.rate + '%';
  s += ' ／ お気に入り ' + st.favN + '件';
  return s;
}
// 統計をチップで並べる（ラベル小・muted、数値大・accent）。due を渡すと「今日の復習」も出す。
function statChips(st, due){
  const wrap = document.createElement('div');
  wrap.className = 'statchips';
  const items = [
    ['全問題', st.total + '問'],
    ['回答済み', st.answeredQ + '問'],
    ['正答率', st.rate !== null ? st.rate + '%' : '—'],
    ['お気に入り', st.favN + '件']
  ];
  if (due !== null && due !== undefined) items.push(['今日の復習', due + '件']);
  items.forEach(pair => {
    const c = document.createElement('div');
    c.className = 'statchip';
    const l = document.createElement('span'); l.className = 'sl'; l.textContent = pair[0];
    const v = document.createElement('span'); v.className = 'sv'; v.textContent = pair[1];
    c.appendChild(l); c.appendChild(v);
    wrap.appendChild(c);
  });
  return wrap;
}
function renderDeckList(){
  const list = $('deckList'); list.innerHTML = '';
  let totalDue = 0;
  decks.forEach(d => {
    const due = dueList(d).length; totalDue += due;
    const st = unitStats(d, null);
    const div = document.createElement('div');
    div.className = 'item deckcard';
    div.innerHTML = '<div class="ttl"></div>';
    div.querySelector('.ttl').textContent = deckDisplayName(d);
    div.appendChild(statChips(st, due));
    div.addEventListener('click', () => openDeck(d));
    list.appendChild(div);
  });
  $('deckStats').textContent = totalDue > 0 ? '今日の復習が合計 ' + totalDue + ' 件あります' : '';
}
function renderChapterList(){
  const box = $('chapterList'); box.innerHTML = '';
  const mk = (label, st, onClick, unit, cls) => {
    const div = document.createElement('div');
    div.className = 'item' + (cls ? ' ' + cls : '');
    div.innerHTML = '<div class="ttl"></div><div class="meta"></div><div class="bar"><i></i></div>';
    div.querySelector('.ttl').textContent = label;
    div.querySelector('.meta').textContent = statsLine(st);
    div.querySelector('.bar i').style.width = st.total ? Math.round(st.answeredQ / st.total * 100) + '%' : '0%';
    if (unit && curDeck.summaries && curDeck.summaries[unit]){
      const row = document.createElement('div');
      row.className = 'sumrow';
      const b = document.createElement('button');
      b.className = 'sumbtn';
      b.textContent = 'まとめを読む';
      b.addEventListener('click', e => { e.stopPropagation(); openSummary(unit); });
      row.appendChild(b);
      div.appendChild(row);
    }
    div.addEventListener('click', onClick);
    box.appendChild(div);
  };
  mk('すべての章', unitStats(curDeck, null), () => startSession(curDeck.questions.slice(), '順番モード（すべての章）', 'seqall', { type: 'all' }), null, 'allchap');
  deckUnits(curDeck).forEach(u => {
    mk(unitLabel(u), unitStats(curDeck, u), () => startSession(curDeck.questions.filter(q => q.unit === u), '順番モード（' + unitLabel(u) + '）', 'seq:' + u, { type: 'unit', unit: u }), u);
  });
}
// ---------- 章のまとめ ----------
let sumUnit = null;
let sumReturn = 'deck'; // 'deck' = 章一覧から / 'quiz' = 問題画面から（戻り先が変わる）
function openSummary(unit, from){
  const s = curDeck.summaries && curDeck.summaries[unit];
  if (!s) return;
  sumUnit = unit;
  sumReturn = from || 'deck';
  $('sumBackLabel').textContent = sumReturn === 'quiz' ? '問題に戻る' : '章一覧';
  $('sumUnit').textContent = unitLabel(unit) + ' のまとめ';
  $('sumIntro').textContent = s.intro || '';
  const fill = (id, arr) => {
    const ul = $(id); ul.innerHTML = '';
    (arr || []).forEach(t => { const li = document.createElement('li'); li.textContent = t; ul.appendChild(li); });
  };
  fill('sumMap', s.map);
  fill('sumPoints', s.points);
  fill('sumTips', s.tips);
  show('view-summary');
  window.scrollTo(0, 0);
}
$('btnSumStart').addEventListener('click', () => {
  if (sumUnit) startSession(curDeck.questions.filter(q => q.unit === sumUnit), '順番モード（' + unitLabel(sumUnit) + '）', 'seq:' + sumUnit, { type: 'unit', unit: sumUnit });
});
$('btnSumTopBack').addEventListener('click', () => {
  if (sumReturn === 'quiz' && session && !session.done){ show('view-quiz'); renderQuestion(); }
  else openDeck(curDeck);
});
function openDeck(d){
  curDeck = d;
  $('hdrTitle').textContent = deckDisplayName(d);
  const due = dueList(d).length;
  $('reviewDesc').textContent = 'お気に入りに登録した問題が、間隔を空けて出題されます。（今日の分：' + due + '件）';
  $('btnReview').disabled = due === 0;
  const ms = $('deckMenuStats'); ms.innerHTML = '';
  ms.appendChild(statChips(unitStats(d, null), null));
  // 未完了のセッションがこのデッキにあれば「続きから解く」を出す（最近使ったもの）
  let best = null;
  Object.keys(sessions).forEach(k => {
    const s = sessions[k];
    if (s.deckId === d.id && !s.done && (!best || (s.lastUsed || 0) > (best.lastUsed || 0))) best = s;
  });
  resumeTarget = best;
  if (best){
    $('resumeDesc').textContent = best.modeLabel + '：' + Object.keys(best.answers).length + ' / ' + best.list.length + ' 問回答済み（' + (best.idx + 1) + '問目から）';
    $('btnResume').style.display = 'block';
  } else {
    $('btnResume').style.display = 'none';
  }
  renderChapterList();
  show('view-deck');
}

// ---------- 出題 ----------
function shuffle(a){ const r = a.slice(); for (let i = r.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
function skey(deckId, key){ return deckId + '|' + key; }
function startSession(list, modeLabel, key, restart, force){
  if (!list.length) return;
  const k = key ? skey(curDeck.id, key) : null;
  if (!force && k && sessions[k] && !sessions[k].done){
    session = sessions[k]; // 未完了の同じセッションがあれば、回答状態を保ったまま再開する
  } else {
    session = { list: list, idx: 0, modeLabel: modeLabel, answers: {}, key: key || null, deckId: curDeck.id, restart: restart || null, done: false };
    if (k) sessions[k] = session;
  }
  session.lastUsed = Date.now();
  show('view-quiz');
  renderQuestion();
}
function renderQuestion(){
  const q = session.list[session.idx];
  const picked = session.answers[session.idx];
  session.lastUsed = Date.now();
  $('qUnit').textContent = unitLabel(q.unit);
  $('qUnit').style.cursor = (curDeck.summaries && curDeck.summaries[q.unit]) ? 'pointer' : '';
  $('qProg').textContent = (session.idx + 1) + ' / ' + session.list.length;
  $('qBarFill').style.width = session.list.length ? Math.round(Object.keys(session.answers).length / session.list.length * 100) + '%' : '0%';
  $('qText').textContent = q.question;
  const star = $('btnStar');
  star.classList.toggle('on', isFav(curDeck.id, q.id));
  star.querySelector('svg').setAttribute('fill', isFav(curDeck.id, q.id) ? 'currentColor' : 'none');
  const box = $('qChoices'); box.innerHTML = '';
  q.choices.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'choice'; b.textContent = (i + 1) + '. ' + c;
    b.addEventListener('click', () => answer(i));
    box.appendChild(b);
  });
  $('qPanel').classList.remove('on');
  $('favPrompt').classList.remove('on');
  $('btnPrev').disabled = session.idx === 0;
  $('btnNextQ').textContent = session.idx + 1 >= session.list.length ? '結果を見る' : '次の問題 →';
  if (picked !== undefined) showAnswered(q, picked);
}
// 回答済みの問題を表示する（戻ってきたときも自分の回答と解説が見える状態）
function showAnswered(q, picked){
  const correct = picked === q.answer;
  const btns = $('qChoices').querySelectorAll('.choice');
  btns.forEach((b, j) => {
    b.disabled = true;
    if (j === q.answer) b.classList.add('correct');
    else if (j === picked) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  const v = $('qVerdict');
  v.textContent = correct ? '正解' : '不正解（正解は ' + (q.answer + 1) + '）';
  v.className = 'verdict ' + (correct ? 'ok' : 'ng');
  $('qExplain').textContent = q.explanation || '';
  const trap = $('qTrap');
  const note = (!correct && q.distractor_notes) ? q.distractor_notes[String(picked)] : null;
  if (note){ trap.style.display = 'block'; trap.innerHTML = '<b>選んだ選択肢について：</b>'; trap.appendChild(document.createTextNode(note)); }
  else trap.style.display = 'none';
  $('qPanel').classList.add('on');
  if (!correct && !isFav(curDeck.id, q.id)) $('favPrompt').classList.add('on');
}
function answer(i){
  if (session.answers[session.idx] !== undefined) return; // 回答済みは数え直さない
  const q = session.list[session.idx];
  session.answers[session.idx] = i;
  const correct = i === q.answer;
  recordHist(curDeck.id, q.id, correct);
  applySRS(curDeck.id, q.id, correct);
  saveState();
  renderQuestion();
}
function prevQuestion(){
  if (session.idx > 0){ session.idx -= 1; renderQuestion(); }
}
function nextQuestion(){
  if (session.idx + 1 >= session.list.length) renderResult();
  else { session.idx += 1; renderQuestion(); }
}
function renderResult(){
  session.done = true; // 終わったセッションは再開対象にしない（章タップで最初から始まる）
  let answered = 0, correctCount = 0;
  const misses = [];
  session.list.forEach((q, i) => {
    const p = session.answers[i];
    if (p === undefined) return;
    answered += 1;
    if (p === q.answer) correctCount += 1; else misses.push({ q: q, picked: p });
  });
  $('resScore').textContent = correctCount + ' / ' + answered + ' 問正解';
  $('resSub').textContent = session.modeLabel + (answered < session.list.length ? '（全' + session.list.length + '問中 ' + answered + '問に回答）' : '');
  const box = $('resMiss'); box.innerHTML = '';
  $('resMissTitle').style.display = misses.length ? 'block' : 'none';
  misses.forEach(m => {
    const div = document.createElement('div');
    div.className = 'missitem';
    const qd = document.createElement('div'); qd.textContent = m.q.question;
    const ad = document.createElement('div'); ad.className = 'a'; ad.textContent = '正解：' + m.q.choices[m.q.answer];
    div.appendChild(qd); div.appendChild(ad);
    if (!isFav(curDeck.id, m.q.id)){
      const b = document.createElement('button');
      b.textContent = 'お気に入りに登録する';
      b.addEventListener('click', () => { setFav(curDeck.id, m.q.id, true); b.textContent = '登録しました'; b.disabled = true; });
      div.appendChild(b);
    }
    box.appendChild(div);
  });
  // 「もう一度」用に、同じ条件で組み直したリストを用意する
  resultRestart = null;
  if (session.restart){
    const r = session.restart;
    let list = null, label = 'もう一度';
    if (r.type === 'unit'){ list = curDeck.questions.filter(q => q.unit === r.unit); label = 'この章をもう一度'; }
    else if (r.type === 'all'){ list = curDeck.questions.slice(); }
    else if (r.type === 'review'){ list = dueList(curDeck); label = '復習をもう一度'; }
    else if (r.type === 'random'){ list = shuffle(curDeck.questions); }
    if (list && list.length){ resultRestart = { list: list }; $('btnResRetry').textContent = label; $('btnResRetry').style.display = 'block'; }
    else $('btnResRetry').style.display = 'none';
  } else {
    $('btnResRetry').style.display = 'none';
  }
  show('view-result');
}

// ===== GitHub 同期（単語アプリと同じ base-snapshot 方式） =====
// 進捗は Shuka314/app-data の quiz_progress.json に保存する。
// 起動時：base（前回同期した状態）と比べて、GitHubが新しければ取り込み、
// 自分が新しければ送信、両方変わっていれば進捗優先でマージして送信。
// 利用中：変更のたびに送信のみ。
const PROGRESS_FILE = 'quiz_progress.json';
let ghCfg = null;
try { ghCfg = JSON.parse(localStorage.getItem('quizGhCfg') || 'null'); } catch(e){}
if (!ghCfg) ghCfg = { owner: 'Shuka314', repo: 'app-data', token: '', branch: 'main' };
function ghReady(){ return !!(ghCfg && ghCfg.owner && ghCfg.repo && ghCfg.token); }
function b64enc(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64dec(b64){ return decodeURIComponent(escape(atob(b64.replace(/\s/g, '')))); }
let ghBase = null; // {sha, state}
try { ghBase = JSON.parse(localStorage.getItem('quizGhBase') || 'null'); } catch(e){}
function saveBase(){ try { localStorage.setItem('quizGhBase', JSON.stringify(ghBase)); } catch(e){} }
function progressSnapshot(){ return { favs: state.favs || {}, srs: state.srs || {}, hist: state.hist || {} }; }
function canonState(s){ return JSON.stringify({ favs: s.favs || {}, srs: s.srs || {}, hist: s.hist || {} }); }
function sameState(a, b){ return canonState(a) === canonState(b); }
function pendingSync(){ if (!ghBase) return !sameState(progressSnapshot(), { favs:{}, srs:{}, hist:{} }); return !sameState(progressSnapshot(), ghBase.state); }

let syncBusy = false, syncErr = '', lastSync = 0;
const svgIc = (p, s) => '<svg width="' + (s || 15) + '" height="' + (s || 15) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px" aria-hidden="true">' + p + '</svg>';
const ICONS = {
  cloud: svgIc('<path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>'),
  refresh: svgIc('<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>'),
  alert: svgIc('<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>'),
  up: svgIc('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>')
};
function ghStatus(msg){ const el = $('ghStatus'); if (el) el.innerHTML = msg.replace(/^☁ /, ICONS.cloud + ' ').replace(/^⚠ /, ICONS.alert + ' '); }
function syncUi(){
  const p = $('syncPill'); if (!p) return;
  p.classList.remove('err');
  if (!ghReady()) p.innerHTML = ICONS.cloud + ' 未設定';
  else if (syncBusy) p.innerHTML = ICONS.refresh + ' 同期中…';
  else if (syncErr){ p.innerHTML = ICONS.alert + ' 失敗（タップで再試行）'; p.classList.add('err'); }
  else if (pendingSync()) p.innerHTML = ICONS.up + ' 未送信あり（タップで同期）';
  else p.innerHTML = ICONS.cloud + ' 同期済み';
}
async function ghApi(method, payload){
  const url = 'https://api.github.com/repos/' + ghCfg.owner + '/' + ghCfg.repo + '/contents/' + PROGRESS_FILE + (method === 'GET' ? ('?ref=' + (ghCfg.branch || 'main') + '&_=' + Date.now()) : '');
  const opt = { method: method, headers: { 'Authorization': 'Bearer ' + ghCfg.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' } };
  if (method === 'GET') opt.cache = 'no-store';
  if (payload){ opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(payload); }
  const res = await fetch(url, opt);
  if (res.status === 404) return null;
  if (!res.ok) throw new Error('GitHub API ' + res.status);
  return res.json();
}
async function ghGetProgress(){
  const j = await ghApi('GET');
  if (!j) return null;
  return { state: JSON.parse(b64dec(j.content)), sha: j.sha };
}
async function ghPutProgress(sha){
  const payload = { message: 'sync ' + PROGRESS_FILE, content: b64enc(JSON.stringify(progressSnapshot(), null, 2)), branch: ghCfg.branch || 'main' };
  if (sha) payload.sha = sha;
  const j = await ghApi('PUT', payload);
  if (!j) throw new Error('GitHub API 404（リポジトリが見えていません）');
  return j && j.content ? j.content.sha : null;
}
function mergeProgress(local, remote){
  const out = { favs: {}, srs: {}, hist: {} };
  const keys = new Set();
  [local, remote].forEach(s => { ['favs','srs','hist'].forEach(k => Object.keys(s[k] || {}).forEach(d => keys.add(d))); });
  keys.forEach(dk => {
    const f = {};
    [local, remote].forEach(s => Object.keys((s.favs || {})[dk] || {}).forEach(k => { f[k] = true; }));
    out.favs[dk] = f; // お気に入りは和集合（どちらかで登録されていれば残す）
    const sm = {};
    const ls = (local.srs || {})[dk] || {}, rs = (remote.srs || {})[dk] || {};
    new Set([...Object.keys(ls), ...Object.keys(rs)]).forEach(k => {
      const a = ls[k], b = rs[k];
      if (!a) sm[k] = b; else if (!b) sm[k] = a;
      else {
        const sa = [a.interval || 0, String(a.next_review || '')], sb = [b.interval || 0, String(b.next_review || '')];
        sm[k] = (sb[0] > sa[0] || (sb[0] === sa[0] && sb[1] >= sa[1])) ? b : a; // 間隔が進んでいる方を優先
      }
    });
    Object.keys(sm).forEach(k => { if (!f[k]) delete sm[k]; });
    out.srs[dk] = sm;
    const hm = {};
    const lh = (local.hist || {})[dk] || {}, rh = (remote.hist || {})[dk] || {};
    new Set([...Object.keys(lh), ...Object.keys(rh)]).forEach(k => {
      const a = lh[k], b = rh[k];
      if (!a) hm[k] = b; else if (!b) hm[k] = a; else hm[k] = ((b.seen || 0) > (a.seen || 0)) ? b : a;
    });
    out.hist[dk] = hm;
  });
  return out;
}
function adoptProgress(s){
  state.favs = s.favs || {}; state.srs = s.srs || {}; state.hist = s.hist || {};
  persist();
}
async function syncNow(){
  if (!ghReady() || syncBusy) return;
  syncBusy = true; syncErr = ''; syncUi();
  try {
    const remote = await ghGetProgress();
    if (!remote){
      const sha = await ghPutProgress(null);
      ghBase = { sha: sha, state: progressSnapshot() }; saveBase();
    } else {
      const localChanged = !ghBase || !sameState(progressSnapshot(), ghBase.state);
      const remoteChanged = !ghBase || remote.sha !== ghBase.sha;
      if (remoteChanged && !localChanged){
        adoptProgress(remote.state);
        ghBase = { sha: remote.sha, state: remote.state }; saveBase();
      } else if (localChanged && !remoteChanged){
        const sha = await ghPutProgress(remote.sha);
        ghBase = { sha: sha, state: progressSnapshot() }; saveBase();
      } else if (localChanged && remoteChanged){
        adoptProgress(mergeProgress(progressSnapshot(), remote.state));
        const sha = await ghPutProgress(remote.sha);
        ghBase = { sha: sha, state: progressSnapshot() }; saveBase();
      } else {
        ghBase = { sha: remote.sha, state: remote.state }; saveBase();
      }
    }
    lastSync = Date.now();
    ghStatus('☁ 同期済み ' + new Date().toLocaleTimeString());
  } catch(e){
    syncErr = e.message || 'error';
    ghStatus('⚠ 同期失敗（' + syncErr + '）。owner・repo・トークンの権限を確認してください。');
  }
  syncBusy = false; syncUi();
  renderDeckList();
}
let pushTimer = null;
function schedulePush(){
  if (!ghReady()) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushProgress, 1200);
}
async function pushProgress(){
  if (!ghReady()) return;
  if (syncBusy){ schedulePush(); return; }
  if (!pendingSync()){ syncUi(); return; }
  if (!ghBase){ syncNow(); return; }
  syncBusy = true; syncUi();
  try {
    const sha = await ghPutProgress(ghBase.sha);
    ghBase = { sha: sha, state: progressSnapshot() }; saveBase();
    lastSync = Date.now();
  } catch(e){
    syncBusy = false;
    syncNow(); // 競合の可能性 → 取り込み＋マージ＋送信に切り替え
    return;
  }
  syncBusy = false; syncUi();
}
function fillGhForm(){
  $('ghOwner').value = ghCfg.owner || 'Shuka314';
  $('ghRepo').value = ghCfg.repo || 'app-data';
  $('ghBranch').value = ghCfg.branch || 'main';
  $('ghToken').value = ghCfg.token || '';
}
function applyGhForm(){
  ghCfg = { owner: $('ghOwner').value.trim() || 'Shuka314', repo: $('ghRepo').value.trim() || 'app-data', token: $('ghToken').value.trim(), branch: $('ghBranch').value.trim() || 'main' };
  try { localStorage.setItem('quizGhCfg', JSON.stringify(ghCfg)); } catch(e){}
  return ghReady();
}
$('ghSave').addEventListener('click', async () => {
  if (applyGhForm()){
    ghBase = null; saveBase(); await syncNow();
    if (!decks.length){
      // トークンを入れたらデッキも読みにいく（設定画面からそのまま使い始められるように）
      try { if (await fetchDecksFromGitHub()) show('view-decks'); }
      catch(e){ showDeckGuide('error', e.message); show('view-decks'); }
    } else {
      revalidateDecks();
    }
  }
  else ghStatus('トークンを入力してください。');
  syncUi();
});
$('btnGuideSettings').addEventListener('click', () => {
  const cur = document.querySelector('.view.on');
  if (cur) lastView = cur.id;
  fillGhForm(); show('view-about');
});
$('btnGuideRetry').addEventListener('click', async () => {
  hideDeckGuide();
  try { await fetchDecksFromGitHub(); }
  catch(e){ showDeckGuide('error', e.message); }
});
$('ghSyncNow').addEventListener('click', async () => { applyGhForm(); await syncNow(); });
$('syncPill').addEventListener('click', async () => {
  if (!ghReady()){
    const cur = document.querySelector('.view.on'); if (cur) lastView = cur.id;
    fillGhForm(); show('view-about'); return;
  }
  await syncNow();
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && ghReady() && !syncBusy && (pendingSync() || Date.now() - lastSync > 60000)) syncNow();
});
window.addEventListener('online', () => { if (ghReady() && !syncBusy) syncNow(); });

// ---------- テーマ（単語アプリと同じ配色セット。初期値はソウル） ----------
let quizTheme = 'souls';
try { quizTheme = localStorage.getItem('quizTheme') || 'souls'; } catch(e){}
function paintTheme(){ document.body.className = quizTheme; const s = $('themeSel'); if (s) s.value = quizTheme; }
$('themeSel').addEventListener('change', e => { quizTheme = e.target.value; try { localStorage.setItem('quizTheme', quizTheme); } catch(err){} paintTheme(); });
paintTheme();
$('ghForm').addEventListener('submit', e => e.preventDefault());

// ---------- 起動 ----------
(async function boot(){
  fillGhForm(); syncUi();
  const cache = loadDeckCache();
  if (cache){
    // キャッシュを先に表示し、裏で更新を確認する
    decks = cache.decks;
    renderDeckList(); show('view-decks');
    revalidateDecks();
  } else if (!ghReady()){
    // トークン未設定ではデッキは読めない（理由と設定への導線を表示する）
    showDeckGuide('token'); show('view-decks');
  } else {
    show('view-decks');
    try { await fetchDecksFromGitHub(); }
    catch(e){ showDeckGuide('error', e.message); }
  }
  if (ghReady()) await syncNow();
})();
</script>
